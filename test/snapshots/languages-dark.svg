<svg xmlns="http://www.w3.org/2000/svg" width="480" height="194" viewBox="0 0 480 194" role="img" aria-labelledby="truestats-languages-title truestats-languages-desc">
  <title id="truestats-languages-title">Most used languages</title>
  <desc id="truestats-languages-desc">Go 48.4%, TypeScript 24.2%, Swift 20.1%, CSS 4.0%, Shell 1.6%, Other 1.7%</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #e6edf3; }
    .label { font-size: 13px; fill: #8b949e; }
    .value { font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .small { font-size: 11px; fill: #8b949e; }
    .big { font-size: 28px; font-weight: 600; fill: #c9d1d9; }
    .accent { fill: #58a6ff; }
    .body { font-size: 13px; fill: #c9d1d9; }
  </style>
  <rect x="0.5" y="0.5" width="479" height="193" rx="7.5" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="36" class="title">Most used languages</text>
  <defs>
    <clipPath id="truestats-lang-bar"><rect x="24" y="54" width="432" height="10" rx="5"/></clipPath>
  </defs>
  <rect x="24" y="54" width="432" height="10" rx="5" fill="#21262d"/>
  <g clip-path="url(#truestats-lang-bar)">
    <rect x="24.00" y="54" width="208.90" height="10" fill="#00ADD8"/>
    <rect x="232.90" y="54" width="104.45" height="10" fill="#3178c6"/>
    <rect x="337.35" y="54" width="87.04" height="10" fill="#F05138"/>
    <rect x="424.39" y="54" width="17.41" height="10" fill="#663399"/>
    <rect x="441.79" y="54" width="6.96" height="10" fill="#89e051"/>
    <rect x="448.76" y="54" width="7.24" height="10" fill="#8b949e"/>
  </g>
  <g>
    <circle cx="29" cy="88" r="5" fill="#00ADD8"/>
    <text x="40" y="92" class="body">Go</text>
    <text x="228" y="92" class="label" text-anchor="end">48.4%</text>
  </g>
  <g>
    <circle cx="245" cy="88" r="5" fill="#3178c6"/>
    <text x="256" y="92" class="body">TypeScript</text>
    <text x="444" y="92" class="label" text-anchor="end">24.2%</text>
  </g>
  <g>
    <circle cx="29" cy="112" r="5" fill="#F05138"/>
    <text x="40" y="116" class="body">Swift</text>
    <text x="228" y="116" class="label" text-anchor="end">20.1%</text>
  </g>
  <g>
    <circle cx="245" cy="112" r="5" fill="#663399"/>
    <text x="256" y="116" class="body">CSS</text>
    <text x="444" y="116" class="label" text-anchor="end">4.0%</text>
  </g>
  <g>
    <circle cx="29" cy="136" r="5" fill="#89e051"/>
    <text x="40" y="140" class="body">Shell</text>
    <text x="228" y="140" class="label" text-anchor="end">1.6%</text>
  </g>
  <g>
    <circle cx="245" cy="136" r="5" fill="#8b949e"/>
    <text x="256" y="140" class="body">Other</text>
    <text x="444" y="140" class="label" text-anchor="end">1.7%</text>
  </g>
  <text x="24" y="172" class="small">By bytes across 4 repositories (2 private). Forks excluded.</text>
</svg>
