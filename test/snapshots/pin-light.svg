  <desc id="truestats-pin-octo-dev-truestats-demo-desc">octo-dev/truestats-demo: A demo repository with a deliberately long description so that the pin card has to wrap it across more than one line of text &amp; escape &lt;markup&gt;.. JavaScript. 1 star, 12 forks.</desc>
