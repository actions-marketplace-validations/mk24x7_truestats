<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="truestats-streak-title truestats-streak-desc">
  <title id="truestats-streak-title">Contribution streak</title>
  <desc id="truestats-streak-desc">Contributions in 2025: 18 (Jan 1 - Jun 6). Current streak (days): 3 (Jun 3 - Jun 5, 2025). Longest streak (days): 5 (Dec 29, 2024 - Jan 2, 2025)</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #e6edf3; }
    .label { font-size: 13px; fill: #8b949e; }
    .value { font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .small { font-size: 12px; fill: #8b949e; }
    .big { font-size: 28px; font-weight: 600; fill: #c9d1d9; }
    .accent { fill: #58a6ff; }
    .body { font-size: 13px; fill: #c9d1d9; }
  </style>
  <rect x="0.5" y="0.5" width="479" height="189" rx="7.5" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="36" class="title">Contribution streak</text>
  <g>
    <text x="96" y="92" class="big" text-anchor="middle">18</text>
    <text x="96" y="118" class="label" text-anchor="middle">Contributions in 2025</text>
    <text x="96" y="138" class="small" text-anchor="middle">Jan 1 - Jun 6</text>
  </g>
  <g>
    <text x="240" y="92" class="big accent" text-anchor="middle">3</text>
    <text x="240" y="118" class="label" text-anchor="middle">Current streak (days)</text>
    <text x="240" y="138" class="small" text-anchor="middle">Jun 3 - Jun 5, 2025</text>
  </g>
  <line x1="168" y1="64" x2="168" y2="142" stroke="#30363d" stroke-width="1"/>
  <g>
    <text x="384" y="92" class="big" text-anchor="middle">5</text>
    <text x="384" y="118" class="label" text-anchor="middle">Longest streak (days)</text>
    <text x="384" y="138" class="small" text-anchor="middle">Dec 29, 2024 - Jan 2, 2025</text>
  </g>
  <line x1="312" y1="64" x2="312" y2="142" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="170" class="small">A streak is consecutive days (UTC) with at least one contribution.</text>
</svg>
