<svg xmlns="http://www.w3.org/2000/svg" width="480" height="282" viewBox="0 0 480 282" role="img" aria-labelledby="truestats-stats-title truestats-stats-desc">
  <title id="truestats-stats-title">Octo Dev&#39;s GitHub stats</title>
  <desc id="truestats-stats-desc">Commits (all time, incl. private): 1,355. Pull requests: 10. Issues: 5. Code reviews: 3. Stars earned: 48. Followers: 1,234. Contributed to (last year): 7</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #70a5fd; }
    .label { font-size: 13px; fill: #7a88cf; }
    .value { font-size: 13px; font-weight: 600; fill: #c0caf5; }
    .small { font-size: 11px; fill: #7a88cf; }
    .big { font-size: 28px; font-weight: 600; fill: #c0caf5; }
    .accent { fill: #bf91f3; }
    .body { font-size: 13px; fill: #c0caf5; }
  </style>
  <rect x="0.5" y="0.5" width="479" height="281" rx="7.5" fill="#1a1b27" stroke="#2f334d"/>
  <text x="24" y="36" class="title">Octo Dev&#39;s GitHub stats</text>
  <g>
    <rect x="24" y="60" width="3" height="12" rx="1.5" class="accent"/>
    <text x="36" y="70" class="label">Commits (all time, incl. private)</text>
    <text x="456" y="70" class="value" text-anchor="end">1,355</text>
  </g>
  <g>
    <rect x="24" y="86" width="3" height="12" rx="1.5" class="accent" opacity="0.35"/>
    <text x="36" y="96" class="label">Pull requests</text>
    <text x="456" y="96" class="value" text-anchor="end">10</text>
  </g>
  <g>
    <rect x="24" y="112" width="3" height="12" rx="1.5" class="accent" opacity="0.35"/>
    <text x="36" y="122" class="label">Issues</text>
    <text x="456" y="122" class="value" text-anchor="end">5</text>
  </g>
  <g>
    <rect x="24" y="138" width="3" height="12" rx="1.5" class="accent" opacity="0.35"/>
    <text x="36" y="148" class="label">Code reviews</text>
    <text x="456" y="148" class="value" text-anchor="end">3</text>
  </g>
  <g>
    <rect x="24" y="164" width="3" height="12" rx="1.5" class="accent" opacity="0.35"/>
    <text x="36" y="174" class="label">Stars earned</text>
    <text x="456" y="174" class="value" text-anchor="end">48</text>
  </g>
  <g>
    <rect x="24" y="190" width="3" height="12" rx="1.5" class="accent" opacity="0.35"/>
    <text x="36" y="200" class="label">Followers</text>
    <text x="456" y="200" class="value" text-anchor="end">1,234</text>
  </g>
  <g>
    <rect x="24" y="216" width="3" height="12" rx="1.5" class="accent" opacity="0.35"/>
    <text x="36" y="226" class="label">Contributed to (last year)</text>
    <text x="456" y="226" class="value" text-anchor="end">7</text>
  </g>
  <text x="24" y="260" class="small">Since 2024. Commits include 1,300 private contributions.</text>
</svg>
