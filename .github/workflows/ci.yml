name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Check files are pure ASCII
        run: npm run check-ascii
      - name: Check dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "::error::dist/index.js is stale. Run npm run build and commit the result."; exit 1; }
